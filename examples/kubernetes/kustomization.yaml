apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - deployment.yaml
images:
  - name: ghcr.io/fairbearlab/descry
    # newTag is the release this example is written for, but no image is
    # published under this name yet. README.md builds one locally and
    # overrides this entry from a throwaway overlay, so leave it as is.
    newTag: v0.5.0
labels:
  # Added to every object and to the pod template, but not to the Deployment's
  # selector, which is immutable once created.
  - pairs:
      app.kubernetes.io/part-of: descry
    includeSelectors: false
    includeTemplates: true
