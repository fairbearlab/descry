apiVersion: v1
kind: ConfigMap
metadata:
  name: descry
data:
  config.yaml: |
    # Events go to the pod log (kubectl logs): the container's root filesystem
    # is read-only, so the file sink has nowhere to write.
    source: descry/kubernetes-example
    sink: stdout
    # A short interval so the example shows results quickly. A target's first
    # check fires up to one interval after start.
    interval: 10s
    timeout: 5s
    concurrency: 2
    targets:
      # Expected UP: a public HTTPS endpoint. Needs egress to the internet.
      - url: https://example.com
      # Expected DOWN, on purpose. On kind (and any cluster whose Service
      # range is private) the kube-apiserver Service resolves to a private
      # ClusterIP, which descry's dial guard refuses, so this target reports
      # status down with error class ssrf_blocked. Port 443 is on the guard's
      # port allowlist, so it is the address, not the port, that is refused.
      # Where Service IPs come from a public range, the guard lets it through
      # and the check fails with tls_error instead (see README.md).
      - url: https://kubernetes.default.svc.cluster.local/
