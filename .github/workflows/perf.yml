# Perf gate (PERF-PLAN §4, D33/D34): same-job relative benchstat, structural
# scale asserts, and fuzzing. Everything here is pull_request-triggered, never
# cron — GitHub auto-disables scheduled workflows on idle repos after 60 days.
name: perf
on:
  pull_request: { branches: [main] }
permissions:
  contents: read
concurrency:
  group: perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    # An explicit bash shell runs with `-e -o pipefail`; the default `bash -e`
    # has no pipefail, so `go test | tee` would swallow a failed build and the
    # gate below would compare empty files.
    shell: bash
jobs:
  # Relative regression gate (D33): benchmark the merge-base and the head in
  # the SAME job on the SAME runner, then compare with benchstat. Same-job
  # cancels machine, VM-contention, and Go-version noise, so no stored
  # baseline file and no absolute thresholds. Fails on a ≥ +10% ns/op
  # regression with p < 0.05 on the runner dispatch and sink benchmarks.
  benchstat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # merge-base needs history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: install benchstat
        # x/perf has no tagged releases; pinned to the pseudo-version that was
        # @latest when this gate landed (2026-09-01).
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260825160852-19be9d8e6c70
      - name: bench merge-base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          echo "merge-base: $base"
          git worktree add ../base "$base"
          cd ../base
          go test -run '^$' -bench . -count=10 -timeout 20m ./runner/ ./sink/ | tee "$GITHUB_WORKSPACE/base.txt"
      - name: bench head
        run: go test -run '^$' -bench . -count=10 -timeout 20m ./runner/ ./sink/ | tee head.txt
      - name: benchstat gate
        run: |
          benchstat base.txt head.txt | tee benchstat.txt
          # Renamed/removed benchmarks silently leave the comparison (benchstat
          # only pairs rows present on both sides), so surface any name-set
          # difference in the log rather than gating on it — adding a benchmark
          # in a PR is legitimate.
          if ! diff <(grep -oE '^Benchmark[^ ]+' base.txt | sort -u) \
                    <(grep -oE '^Benchmark[^ ]+' head.txt | sort -u) >/dev/null; then
            echo "::warning::benchmark name sets differ between base and head — renamed/removed benchmarks are not gated"
          fi
          # Gate on the sec/op section only (B/op and allocs/op are guarded by
          # the alloc-count tests, run without -race in the scale job below).
          # benchstat prints a delta column only for statistically significant
          # rows ("~" otherwise); we still parse the p-value explicitly and
          # fail on ≥ +10% with p < 0.05. Zero parsed rows fails closed: it
          # means empty/truncated bench output or a benchstat format change,
          # not a clean bill.
          awk '
            /sec\/op.*vs base/ { insec = 1; next }
            /(B\/op|allocs\/op).*vs base/ { insec = 0; next }
            insec && /\(p=/ {
              rows++
              delta = ""; p = 1
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^\+[0-9.]+%$/) delta = substr($i, 2, length($i) - 2) + 0
                if ($i ~ /^\(p=[0-9.]+$/) p = substr($i, 4) + 0
              }
              if (delta != "" && delta >= 10 && p < 0.05) {
                bad = 1
                printf "REGRESSION: %s\n", $0
              }
            }
            END {
              if (rows == 0) { print "benchstat gate: no comparable sec/op rows parsed — failing closed"; exit 1 }
              if (bad) { print "benchstat gate: ns/op regressed >= 10% with p < 0.05"; exit 1 }
              printf "benchstat gate: no significant ns/op regression >= 10%% (%d rows compared)\n", rows
            }
          ' benchstat.txt

  # Structural asserts (PERF-PLAN §3.5): the scale harness runs with a real
  # clock, no -race and no -short. Healthy regime asserts zero skips,
  # Dropped()==0, and scheduler-owned goroutines ≤ concurrency+8; saturated
  # asserts the accounting identity, no starvation, and flat goroutines.
  # Start-lateness is printed in the log, never asserted — shared CI runners
  # make the number meaningless.
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -run 'TestScale' -v -timeout 10m ./runner/
      - name: alloc guards
        # Every AllocsPerRun guard skips itself under -race, and ci.yml only
        # runs -race — without this step the alloc bounds never execute in CI.
        run: go test -run 'Allocs' -v ./...

  # Coverage-guided fuzzing: the scheduler oracle plus the SSRF guards from
  # PR #14. The seed corpora still run as normal tests in every `go test`
  # invocation (ci.yml); this job is the budgeted exploration on top.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: fuzz scheduler
        run: go test -run '^$' -fuzz '^FuzzScheduler$' -fuzztime=60s ./runner/
      - name: fuzz SSRF layer 1 (assertSafeURL)
        run: go test -run '^$' -fuzz '^FuzzAssertSafeURL$' -fuzztime=60s ./checks/http/
      - name: fuzz SSRF blocked-IP classifier
        run: go test -run '^$' -fuzz '^FuzzIsBlockedIP$' -fuzztime=60s ./checks/http/
      - name: upload fuzz crashers
        # A crasher found on the runner is written to testdata/fuzz/ and lost
        # with the VM unless preserved; without this the failure is
        # unreproducible locally.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: |
            runner/testdata/fuzz/**
            checks/http/testdata/fuzz/**
          if-no-files-found: ignore
