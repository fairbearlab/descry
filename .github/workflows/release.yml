name: release
on:
  push: { tags: ['v*'] }
permissions:
  contents: read
# Overlapping tag runs must not race: two releases pushing at once could move
# latest backwards. A second tag run waits as pending, and a running one is
# never cancelled mid-publish. GitHub keeps at most one pending run per group,
# though: a third tag pushed while one run is in progress and one is pending
# cancels the pending one, which then needs a re-run, but only if no newer
# tag has released since; otherwise patch forward, because a late re-run would
# move latest back. So push one tag at a time. latest follows the most recent
# final release run, and releases patch forward on the newest line only.
concurrency: { group: release, cancel-in-progress: false }
jobs:
  # A job-level permissions block replaces the workflow-level one. The release
  # job writes the GitHub release (contents), pushes the image to GHCR
  # (packages), and signs keylessly with cosign using the workflow's OIDC
  # token (id-token). The signing identity is this file at the pushed tag,
  # which is what the verify commands in README.md pin.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # No build cache: a tag run can restore caches written by main-branch
      # runs, and whatever it builds is signed as this workflow. A release
      # builds cold so nothing restored ends up in a signed artifact.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: false }
      # When cosign-release equals the installer's bootstrap version, the
      # binary is checked against the digest embedded in the installer. For any
      # other version, the installer verifies the download with keyless
      # verify-blob using its bootstrap binary. Either way cosign is pinned on
      # its own and bumped deliberately, independent of the installer SHA.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: v3.0.6 }
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # An exact goreleaser, the same one ci.yml's release-check runs, so CI
      # checks what a tag releases with. Bump all three steps together.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Release the tag that was pushed. Otherwise goreleaser takes the
          # highest tag pointing at HEAD, so a re-run of an older tag on a
          # commit carrying two tags would publish under the newer one while
          # signing as the older ref.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
