name: release
on:
  push: { tags: ['v*'] }
permissions:
  contents: read
# Overlapping tag runs must not race: two releases pushing at once could move
# latest backwards. Queue them instead, and never cancel one mid-publish.
concurrency: { group: release, cancel-in-progress: false }
jobs:
  # A job-level permissions block replaces the workflow-level one. The release
  # job writes the GitHub release (contents), pushes the image to GHCR
  # (packages), and signs keylessly with cosign using the workflow's OIDC
  # token (id-token). The signing identity is this file at the pushed tag,
  # which is what the verify commands in README.md pin.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # No build cache: a tag run can restore caches written by main-branch
      # runs, and whatever it builds is signed as this workflow. A release
      # builds cold so nothing restored ends up in a signed artifact.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: false }
      # The installer checks the cosign binary against digests in the action
      # itself; v3.0.6 is the version this installer release pins.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: v3.0.6 }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # An exact goreleaser, the same one ci.yml's release-check runs, so CI
      # checks what a tag releases with. Bump all three steps together.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
