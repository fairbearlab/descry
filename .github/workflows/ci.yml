name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go mod tidy -diff
      # The engine packages stay dependency-light for embedders: prometheus may
      # appear only in metrics/ and cmd/. Every other package in the module is
      # engine, so a new package is checked without editing this step, and the
      # step fails closed: a go list error or an empty engine set turns it red.
      # The set is listed per GOOS: go list ./... leaves out a package whose
      # files are all for another platform, and go list -deps fails on one.
      # Test-only imports are not checked (they never reach embedders).
      - name: engine packages do not depend on prometheus
        run: |
          set -euo pipefail
          mod="$(go list -m)" || exit 1
          for goos in linux darwin windows; do
            pkgs="$(GOOS="$goos" go list ./...)" || exit 1
            list="$(printf '%s\n' "$pkgs" | grep -Ev "^${mod}/(metrics|cmd)(/|\$)")" || {
              echo "::error::no engine packages found (GOOS=$goos)"
              exit 1
            }
            mapfile -t engine <<<"$list"
            echo "engine packages (GOOS=$goos):"
            printf '  %s\n' "${engine[@]}"
            deps="$(GOOS="$goos" go list -deps "${engine[@]}")" || exit 1
            if bad="$(printf '%s\n' "$deps" | grep '^github.com/prometheus/')"; then
              echo "::error::engine packages must not import prometheus (GOOS=$goos):"
              printf '%s\n' "$bad"
              exit 1
            fi
          done
      - run: go test -race -coverprofile=coverage.out ./...
      # Coverage floor. Measured 85.7% of statements on main when last raised
      # (2026-10-05; identical across five -race runs and in CI). It was added at
      # 75 against 76.0-76.4%, when the runner package's concurrent paths made the
      # total drift a few tenths between runs. The floor is the low end minus one
      # point, rounded down, so neither that drift nor ordinary churn trips it but
      # a real regression does. Re-measure and raise it as coverage grows.
      #
      # This number is Go's *statement* coverage and will not match the Codecov
      # badge, which counts *lines*. Both are correct; they measure different
      # things.
      - name: coverage floor
        env:
          COVERAGE_FLOOR: '84'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          if [ -z "$total" ]; then
            echo "could not parse a total from coverage.out" >&2
            exit 1
          fi
          echo "total coverage: ${total}% (floor: ${COVERAGE_FLOOR}%)"
          awk -v t="$total" -v f="$COVERAGE_FLOOR" \
            'BEGIN { if (t+0 < f+0) { printf "coverage %.4f%% is below the %s%% floor\n", t, f; exit 1 } }'
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
  # Validates .goreleaser.yaml and runs a snapshot release with publishing
  # and signing skipped. The ko pipe still runs: it builds the linux/amd64
  # and linux/arm64 images and loads the linux/amd64 one into the runner's
  # Docker daemon under goreleaser.ko.local (the daemon publisher loads a
  # single platform). That is the only build of the image before a
  # tag. The push and the cosign signatures first run on a tag. Both steps
  # pin the exact goreleaser release.yml runs, so CI checks the same one a
  # tag releases with; bump all three together.
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: check
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: release --snapshot --clean --skip=publish,sign
      # Go stamps the git state into the binary, and a tree with any change
      # or untracked file reads +dirty and vcs.modified=true in
      # `go version -m`. goreleaser writes dist/ into the tree before it
      # builds, and its before hook runs go mod tidy, so an unignored output
      # or a tidy that rewrites go.sum would mark every release binary dirty.
      # The ko image is built from the same tree. The check fails closed: a
      # missing binary, or one with no VCS stamp at all, fails it too.
      - name: snapshot binary is not stamped dirty
        run: |
          set -euo pipefail
          bin=dist/descry_linux_amd64_v1/descry
          info="$(go version -m "$bin")"
          printf '%s\n' "$info"
          if ! grep -q $'^\tbuild\tvcs.modified=false$' <<<"$info"; then
            echo "::error::$bin is not stamped vcs.modified=false; git status --porcelain:"
            git status --porcelain
            exit 1
          fi
  # The alerting rules ship as a PrometheusRule CR, which promtool cannot read,
  # so the job extracts the plain rule groups with yq and runs promtool on
  # those, with --lint-fatal so a lint finding (a duplicate rule) fails the
  # job instead of only printing a warning. Both tools are fixed release
  # binaries checked against a hard-coded sha256 (taken from each project's
  # published checksums file), so a changed or tampered download fails the
  # job. Bump a version and its digest together.
  # The Go tests in metrics/rules_test.go cover the other half: every series
  # name in the rules must exist in the collector, with every label the rules
  # read from it.
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install yq and promtool
        env:
          YQ_VERSION: v4.54.1
          YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
          PROM_VERSION: 3.15.0
          PROM_SHA256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/yq" \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  $tools/yq" | sha256sum -c -
          chmod +x "$tools/yq"
          tarball="prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/${tarball}"
          echo "${PROM_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$tools" --strip-components=1 \
            "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          echo "$tools" >> "$GITHUB_PATH"
      - name: extract, check and test the rules
        working-directory: contrib/prometheus
        run: |
          set -euo pipefail
          yq '.spec' descry-rules.yaml > descry-rules.extracted.yaml
          promtool check rules --lint-fatal descry-rules.extracted.yaml
          promtool test rules descry-rules.test.yaml
  # The example manifests are kustomize-only (the image tag is set in the
  # kustomization), so the job renders them with kubectl and validates the
  # result with kubeconform. networkpolicy.yaml is opt-in and not in the
  # kustomization, so it is validated on its own. No cluster is involved.
  # Both tools are fixed release binaries checked against a hard-coded
  # sha256: kubectl's from the .sha256 file published next to the binary,
  # kubeconform's from the CHECKSUMS file of its release. Bump a version and
  # its digest together.
  #
  # kubeconform fetches its JSON schemas at run time, by default from the
  # moving master branch of yannh/kubernetes-json-schema. -schema-location
  # points it at one commit of that repository instead (KUBE_SCHEMAS_REF), so
  # what the job accepts cannot change under it. K8S_VERSION picks the schema
  # directory within that commit: bump the two together, to a commit that has
  # a v<K8S_VERSION>-standalone-strict directory, and update the copy of both
  # in the "Validate the manifests" command in examples/kubernetes/README.md.
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install kubectl and kubeconform
        env:
          KUBECTL_VERSION: v1.37.1
          KUBECTL_SHA256: 65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  $tools/kubectl" | sha256sum -c -
          chmod +x "$tools/kubectl"
          tarball="kubeconform-linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/${tarball}"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$tools" kubeconform
          echo "$tools" >> "$GITHUB_PATH"
      - name: render and validate examples/kubernetes
        env:
          K8S_VERSION: 1.37.1
          KUBE_SCHEMAS_REF: 817113f21a2643311cbc3e992bb44ffe1c416c54
        run: |
          set -euo pipefail
          schemas="https://raw.githubusercontent.com/yannh/kubernetes-json-schema/${KUBE_SCHEMAS_REF}/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json"
          kubectl kustomize examples/kubernetes \
            | kubeconform -strict -summary -kubernetes-version "$K8S_VERSION" \
              -schema-location "$schemas"
          kubeconform -strict -summary -kubernetes-version "$K8S_VERSION" \
            -schema-location "$schemas" examples/kubernetes/networkpolicy.yaml
