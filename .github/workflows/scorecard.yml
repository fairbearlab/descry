name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '41 6 * * 1' # Monday 06:41 UTC, offset from govulncheck's 06:17
  push: { branches: [main] }
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    # A job-level `permissions` block replaces the workflow-level `read-all`
    # rather than merging with it, so every scope this job needs must be listed
    # here — anything omitted is `none`.
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results to the OpenSSF API (needed for the badge)
      contents: read # checkout, and Scorecard reading repo contents
      actions: read # Scorecard enumerates workflow runs for several checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: results.sarif
  # GitHub auto-disables scheduled workflows after 60 days of repo inactivity;
  # re-enabling on every scheduled run keeps the cron alive without relying on
  # someone noticing it stopped. The Scorecard badge is served from the last
  # published run, so a silently-dead cron means a silently-stale badge.
  # Separate job so `actions: write` never reaches the job that analyses the repo.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: keep workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/scorecard.yml/enable
