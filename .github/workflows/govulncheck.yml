name: govulncheck
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule:
    - cron: '17 6 * * 1' # Monday 06:17 UTC, quiet time
permissions:
  contents: read
jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go tool govulncheck ./...
  # GitHub auto-disables scheduled workflows after 60 days of repo inactivity;
  # re-enabling on every scheduled run keeps the cron alive without relying on
  # someone noticing it stopped. Separate job so `actions: write` never reaches
  # the job that builds and runs code.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: keep workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/govulncheck.yml/enable
