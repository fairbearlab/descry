# Codecov itself stays informational — it posts the comment and the graph but
# never fails a build. The gate lives in ci.yml instead ("coverage floor" step),
# which enforces a hard minimum on Go's own statement coverage.
#
# Two reasons the gate is there and not here: it runs without a third-party
# service in the path, and it fails on the same number a developer sees from
# `go tool cover -func` locally. Codecov's number is line coverage and reads a
# point or two lower than Go's statement coverage; gating on the one you can
# reproduce offline avoids arguing with a badge.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        # A fixed target, not the default "auto" (the base commit's total, ~86%
        # and rising): against auto, any patch with an uncovered error print
        # renders a red x in the PR comment. 90% passes every feature PR to date
        # (#15 at 90.5%, the lowest) and still flags one that leaves a tenth of
        # its new lines untested.
        target: 90%
        informational: true
